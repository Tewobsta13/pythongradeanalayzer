<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F7F0E7" />

    <meta
      name="description"
      content="Tewobsta AI — a thoughtful AI assistant built with Flask and Google Gemini."
    />

    <title>Tewobsta AI</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>

  <body>
    <a class="skip-link" href="#message-input">Skip to message input</a>

    <div class="app">
      <!-- Header -->
      <header class="app-header">
        <a class="brand" href="/" aria-label="Tewobsta AI home">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-name">Tewobsta <span>AI</span></span>
        </a>

        <button type="button" class="ghost-button" id="new-chat-button">
          + New chat
        </button>
      </header>

      <!-- Main chat -->
      <main class="app-main">
        <!-- Conversation -->
        <section
          class="conversation"
          id="conversation"
          role="log"
          aria-live="polite"
          aria-label="Conversation"
        >
          <div class="empty-state" id="empty-state">
            <span class="empty-mark" aria-hidden="true">
              <span></span>
            </span>

            <p class="empty-title">What’s on your mind?</p>

            <p class="empty-description">
              Ask anything. Let's figure it out together.
            </p>
          </div>
        </section>

        <!-- Message composer -->
        <section class="composer-section" aria-label="Ask Tewobsta AI">
          <form class="composer" id="chat-form" novalidate>
            <label class="visually-hidden" for="message-input">
              Your message
            </label>

            <textarea
              id="message-input"
              name="message"
              rows="1"
              maxlength="4000"
              autocomplete="off"
              placeholder="Message Tewobsta AI..."
              aria-describedby="composer-hint form-error"
            ></textarea>

            <div class="composer-bar">
              <p class="composer-hint" id="composer-hint">
                Your thinking space, without the noise.
              </p>

              <button
                type="submit"
                class="send-button"
                id="send-button"
                disabled
                aria-label="Send message"
              >
                <span class="send-label">Send</span>
                <span aria-hidden="true">↗</span>
              </button>
            </div>
          </form>

          <p class="form-error" id="form-error" role="alert" hidden></p>
        </section>
      </main>

      <!-- Minimal footer -->
      <footer class="app-footer">
        <p>Built with curiosity · Flask + Google Gemini</p>
      </footer>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
  </body>
</html>
